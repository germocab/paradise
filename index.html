<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paradise</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ed;--ink:#121212;--page:#1b1b1b;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f4f4f4;--page:#000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);font:16px/1.4 Figtree,"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:120px;transition:background .6s}
.screen.on{display:block;animation:enter .5s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.7)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#view{color:#111}#edit{background:#151515;color:#fff}
/* banner */
.banner{position:relative;height:380px;margin-bottom:6px;border-radius:0 0 34px 34px;overflow:hidden;background:#222;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 28px;cursor:pointer}
.bgl{position:absolute;inset:0;background:center/cover;animation:fade .8s both,kb 9s ease-out both}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#000a)}
.btxt{position:relative;z-index:2;animation:up .6s var(--ease) both}
.banner h1{font-size:34px;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.8px}
.banner p{margin:0 0 16px;font-size:16px;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc(min(100vw,430px)/3);grid-auto-flow:dense;gap:3px;padding-top:calc(env(safe-area-inset-top,0px) + 0px)}
.nobanner{height:max(18px,env(safe-area-inset-top,0px))}
.tile{position:relative;background:#888 center/cover;border:0;padding:0;cursor:pointer;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i)*35ms);transition:transform .35s var(--spring),filter .2s}
.tile:nth-child(7n+2),.tile:nth-child(7n+5){grid-row:span 2}
.tile:active{transform:scale(.95);filter:brightness(.9)}
.multi{position:absolute;top:7px;right:7px;width:16px;height:16px;filter:drop-shadow(0 1px 3px #0006)}
.empty{padding:90px 30px;text-align:center;font-size:17px;opacity:.6;animation:up .6s var(--ease) both}
/* liquid glass */
.glass{--mx:30%;--my:0%;--tx:0px;--ty:0px;--s:1;position:relative;border:0;font-size:15px;font-weight:600;line-height:1;cursor:pointer;min-width:42px;height:42px;padding:0 18px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation;user-select:none;-webkit-user-select:none;
 color:var(--gfg);background:linear-gradient(135deg,var(--gt),rgba(255,255,255,.06));
 backdrop-filter:blur(14px) saturate(1.9) brightness(1.06);-webkit-backdrop-filter:blur(14px) saturate(1.9) brightness(1.06);
 box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.8),inset -1px -1px 1px rgba(255,255,255,.3),inset 0 0 16px rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.22);
 transform:translate(var(--tx),var(--ty)) scale(var(--s));transition:transform .45s var(--spring),box-shadow .3s,color .5s,background .5s;animation:pop .5s var(--spring) both;animation-delay:calc(var(--i,0)*60ms)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90px 60px at var(--mx) var(--my),rgba(255,255,255,.55),transparent 70%);opacity:.6;transition:opacity .3s}
.glass.pressed{--s:1.14;transition:transform .2s var(--ease);box-shadow:inset 1.5px 1.5px 1px #fffc,inset -1px -1px 1px #fff6,inset 0 0 24px #fff5,0 14px 30px rgba(0,0,0,.28)}
.glass.pressed::before{opacity:1}
.glass.release{animation:wob .6s var(--spring)}
@keyframes wob{0%{transform:scale(1.14)}35%{transform:scale(.94,1.05)}65%{transform:scale(1.04,.98)}100%{transform:scale(1)}}
.refract .glass{backdrop-filter:url(#lg) blur(7px) saturate(1.9) brightness(1.06)}
.glass.lt{--gfg:#111;--gt:rgba(255,255,255,.5)}
.glass.dk{--gfg:#fff;--gt:rgba(255,255,255,.2)}
.glass svg{width:19px;height:19px;position:relative;flex:none}
.round{width:42px;padding:0}.big{width:54px;height:54px}.big svg{width:24px;height:24px}
.glass.danger{--gfg:#ff5a4d}
.heartpop svg{animation:hp .5s var(--spring)}
@keyframes hp{0%{transform:scale(.5)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none}
#bar>*{pointer-events:auto}.grp{display:flex;gap:10px}
/* view */
.stage{padding:max(26px,env(safe-area-inset-top,0px)) 22px 0}
.hero,.card{background:#0002 center/cover;animation:up .7s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
.hero{width:100%;aspect-ratio:1/1.02;border-radius:36px;overflow:hidden;box-shadow:0 18px 40px #0002}
.stack{display:flex;flex-direction:column}
.card{width:66%;aspect-ratio:1/1.05;border-radius:32px;box-shadow:0 14px 34px #0003}
.card:nth-child(even){align-self:flex-end}.card:not(:first-child){margin-top:-36px}
.stage h2{font-size:26px;line-height:1.15;margin:26px 0 8px;font-weight:800;letter-spacing:-.5px;animation:up .7s var(--ease) .15s both}
.stage p.sub{font-size:17px;line-height:1.45;margin:0;white-space:pre-wrap;animation:up .7s var(--ease) .25s both}
.card{cursor:pointer}.card.focus{width:100%;aspect-ratio:1/.95;border-radius:36px;margin-top:0!important;align-self:stretch!important}
.card.mini{width:22%;border-radius:18px;align-self:flex-end!important;box-shadow:0 8px 20px #0003}
.col{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
/* edit */
.imgwrap{display:flex;align-items:flex-end;justify-content:center;padding:14px;border-radius:32px;background:#333 center/cover;aspect-ratio:1/.9;margin-bottom:14px;animation:pop .45s var(--ease) both}
.out{animation:out .25s var(--ease) forwards}
.field{display:block;width:100%;background:transparent;color:#fff;border:1.5px solid #fff7;border-radius:14px;padding:12px 14px;font-size:17px;outline:none;resize:none;transition:border-color .25s,box-shadow .25s}
.field:focus{border-color:#f5a21b;box-shadow:0 0 0 4px #f5a21b30}
input.field{font-size:22px;font-weight:800;margin:20px 0 12px}
textarea.field{line-height:1.45;min-height:110px}
/* compose */
.comp{padding:max(30px,env(safe-area-inset-top,0px)) 22px 0}
.comp h2{margin:0 0 18px;font-size:30px;font-weight:800;letter-spacing:-.6px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:20px;background:#8883 center/cover;animation:pop .45s var(--spring) both}
.thumb .glass{position:absolute;top:6px;right:6px;width:28px;min-width:28px;height:28px;padding:0}.thumb .glass svg{width:14px;height:14px}
.pick{aspect-ratio:1;border-radius:20px;border:2px dashed #8887;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;opacity:.75;cursor:pointer;flex-direction:column;gap:4px;transition:transform .35s var(--spring),opacity .2s;background:none;color:inherit}
.pick:active{transform:scale(.93);opacity:1}.pick svg{width:24px;height:24px}
.counter{font-size:14px;opacity:.6;margin:0 2px 18px}
.inp{width:100%;border:1.5px solid #8885;background:#fff3;border-radius:16px;padding:14px 16px;font-size:17px;color:inherit;margin-bottom:12px;outline:none;transition:border-color .25s,box-shadow .25s}
.inp:focus{border-color:#888;box-shadow:0 0 0 4px #8883}
input.inp{font-weight:700;font-size:19px}textarea.inp{resize:none;line-height:1.45}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,10px);z-index:50;background:#000d;color:#fff;font-size:15px;font-weight:500;padding:11px 18px;border-radius:99px;opacity:0;transition:.35s var(--spring);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="lg" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="1" seed="3" result="n"/><feGaussianBlur in="n" stdDeviation="2" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="app">
  <section class="screen on" id="library"></section>
  <section class="screen" id="view"></section>
  <section class="screen" id="edit"></section>
  <section class="screen" id="compose"></section>
  <div id="bar"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
</div>
<script>
const $=s=>document.querySelector(s);
const IC={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 heart:f=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.7-7.5-10.3A4.2 4.2 0 0112 7.6a4.2 4.2 0 017.5 2.6c0 5.6-7.5 10.3-7.5 10.3z"/></svg>`,
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 multi:'<svg class="multi" viewBox="0 0 16 16" fill="#fff"><rect x="4" y="4" width="10" height="10" rx="2"/><path d="M2 11V3a1 1 0 011-1h8" fill="none" stroke="#fff" stroke-width="1.4"/></svg>'};
if(/Chrome|Edg/.test(navigator.userAgent)&&!/iPhone|iPad|Android.*Firefox/.test(navigator.userAgent))document.documentElement.classList.add('refract');
const isDark=()=>matchMedia('(prefers-color-scheme:dark)').matches;

/* storage */
let posts=[],db=null;
const openDB=()=>new Promise(r=>{try{const q=indexedDB.open('paradise',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const load=()=>new Promise(r=>{if(!db)return r();try{const g=db.transaction('k').objectStore('k').get('posts');g.onsuccess=()=>{posts=g.result||[];r()};g.onerror=()=>r()}catch(e){r()}});
const save=()=>{try{if(db)db.transaction('k','readwrite').objectStore('k').put(posts,'posts')}catch(e){toast('Could not save')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=id=>posts.find(p=>p.id===id);
const sorted=()=>[...posts].sort((a,b)=>b.ts-a.ts);

/* helpers */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('#'+id).scrollTop=0}
const isHeic=f=>/hei[cf]/i.test(f.type)||/\.(heic|heif)$/i.test(f.name);
let heicP=null;const loadHeic=()=>heicP||(heicP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';s.onload=ok;s.onerror=()=>{heicP=null;no()};document.head.append(s)}));
const decode=b=>new Promise(res=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>res({i,u});i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u});
async function processFile(f){let r=await decode(f);
 if(!r&&isHeic(f)){try{toast('Converting HEIC…');await loadHeic();let b=await heic2any({blob:f,toType:'image/jpeg',quality:.85});if(Array.isArray(b))b=b[0];r=await decode(b)}catch(e){}}
 if(!r)return null;const {i,u}=r,k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.82)}
const lumOf=(r,g,b)=>(.2126*r+.7152*g+.0722*b)/255;
const colorInfo=(src,soft)=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(i,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let j=0;j<d.length;j+=4){r+=d[j];g+=d[j+1];b+=d[j+2];n++}r/=n;g/=n;b/=n;
 if(soft){const m=v=>Math.round(v*.55+255*.45);r=m(r);g=m(g);b=m(b)}res({css:`rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`,lum:lumOf(r,g,b)})};i.onerror=()=>res({css:'#ddd',lum:.8});i.src=src});
const toneCls=lum=>lum>.58?'lt':'dk';
function retone(root,lum){root.querySelectorAll('.glass').forEach(b=>{b.classList.remove('lt','dk');b.classList.add(toneCls(lum))})}
function pickFiles(cb){const f=$('#file');f.value='';f.onchange=()=>cb([...f.files]);f.click()}
async function addFiles(draft,fs,done){if(draft.busy)return;draft.busy=true;toast('Processing…');const room=10-draft.imgs.length;const start=draft.imgs.length;let bad=0;for(const f of fs.slice(0,room)){const d=await processFile(f);if(d)draft.imgs.push(d);else bad++}draft.busy=false;if(bad)toast("Couldn't read "+bad+(bad>1?' files':' file'));else if(fs.length>room)toast('Max 10 pictures per post');else $('#toast').classList.remove('on');done(start)}

/* bar */
function mk(spec,tone,i){const b=document.createElement('button');b.className='glass '+tone+(spec.round?' round':'')+(spec.big?' big':'');b.innerHTML=spec.html;b.style.setProperty('--i',i);b.setAttribute('aria-label',spec.label||'');b.onclick=spec.fn;return b}
function setBar(left,rights,lum,stack){const bar=$('#bar'),t=toneCls(lum);bar.innerHTML='';bar.style.justifyContent=stack?'flex-end':'';const l=left?mk(left,t,0):document.createElement('span');const g=document.createElement('div');g.className='grp';rights.forEach((r,i)=>{const b=mk(r,t,i+1);r.el=b;g.append(b)});if(stack){const c=document.createElement('div');c.className='col';c.append(l,g);bar.append(c)}else bar.append(l,g);return {l,g}}

/* liquid glass: reacts to touch */
(()=>{let cur=null,sx=0,sy=0;
 const pos=(e,g)=>{const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')};
 document.addEventListener('pointerdown',e=>{const g=e.target.closest('.glass');if(!g)return;cur=g;sx=e.clientX;sy=e.clientY;g.classList.remove('release');g.classList.add('pressed');pos(e,g)});
 document.addEventListener('pointermove',e=>{const g=cur||e.target.closest?.('.glass');if(!g)return;pos(e,g);if(cur){const k=v=>Math.max(-6,Math.min(6,v*.18));g.style.setProperty('--tx',k(e.clientX-sx)+'px');g.style.setProperty('--ty',k(e.clientY-sy)+'px')}});
 const up=()=>{if(!cur)return;const g=cur;cur=null;g.classList.remove('pressed');g.style.setProperty('--tx','0px');g.style.setProperty('--ty','0px');void g.offsetWidth;g.classList.add('release');setTimeout(()=>g.classList.remove('release'),600)};
 document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)})();

/* library */
let hi=0,hiTimer=null;
function goLibrary(){
 clearInterval(hiTimer);
 const list=sorted(),liked=list.filter(p=>p.liked),L=$('#library');
 L.innerHTML=(liked.length?'<div class="banner" id="banner"></div>':'<div class="nobanner"></div>')+
  (list.length?`<div class="grid">${list.map((p,i)=>`<button class="tile" data-id="${p.id}" style="--i:${Math.min(i,14)};background-image:url(${p.imgs[0]})">${p.imgs.length>1?IC.multi:''}</button>`).join('')}</div>`:'<div class="empty">Your library is empty.<br>Tap + to add your first post.</div>');
 L.querySelectorAll('.tile').forEach(t=>t.onclick=()=>openPost(t.dataset.id));
 if(liked.length){const B=$('#banner');
  const set=()=>{const p=liked[hi%liked.length];B.querySelectorAll('.bgl').forEach(e=>setTimeout(()=>e.remove(),900));
   const bg=document.createElement('div');bg.className='bgl';bg.style.backgroundImage=`url(${p.imgs[0]})`;B.prepend(bg);
   B.querySelector('.btxt')?.remove();const t=document.createElement('div');t.className='btxt';t.innerHTML='<h1></h1><p></p><button class="glass dk">View</button>';t.querySelector('h1').textContent=p.title;t.querySelector('p').textContent=p.sub||'';B.append(t);B.onclick=()=>openPost(p.id)};
  set();if(liked.length>1)hiTimer=setInterval(()=>{hi++;set()},5500)}
 setBar(null,[{html:IC.plus,round:1,big:1,label:'New post',fn:openCompose}],isDark()?0:1);
 show('library');
}

/* view */
async function openPost(id){
 const p=get(id);if(!p)return goLibrary();
 clearInterval(hiTimer);
 const V=$('#view');V.style.background='#cfe3ee';V.style.color='#111';
 V.innerHTML=`<div class="stage">${p.imgs.length==1?`<div class="hero" style="background-image:url(${p.imgs[0]})"></div>`:`<div class="stack">${p.imgs.map((s,i)=>`<div class="card" style="--i:${i};background-image:url(${s})"></div>`).join('')}</div>`}<h2></h2><p class="sub"></p></div>`;
 V.querySelector('h2').textContent=p.title;V.querySelector('.sub').textContent=p.sub||'';
 const st=V.querySelector('.stack');
 if(st){let focus=null;const cards=[...st.children],els=()=>[...cards,V.querySelector('h2'),V.querySelector('.sub')];
  const layout=()=>{let k=0;cards.forEach((c,i)=>{const mini=focus!==null&&focus!==i;c.classList.toggle('focus',focus===i);c.classList.toggle('mini',mini);c.style.order=(focus===null||focus===i)?0:1;c.style.marginTop='';c.style.marginRight='';c.style.zIndex=mini?2:1;if(mini){c.style.marginTop=(k?-30:16)+'px';c.style.marginRight=k%2?'0':'9%';k++}})};
  cards.forEach((c,i)=>{c.style.transformOrigin='0 0';c.onclick=()=>{if(focus===i)return;
   const first=els().map(e=>e.getBoundingClientRect());focus=focus===null?i:null;layout();
   els().forEach((e,j)=>{const a=first[j],b=e.getBoundingClientRect(),isC=j<cards.length;
    e.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${isC?a.width/b.width:1},${isC?a.height/b.height:1})`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})})}})}
 const b=setBar({html:IC.x,round:1,label:'Close',fn:goLibrary},[{html:'Edit',fn:()=>openEdit(id)},{html:IC.heart(p.liked),round:1,label:'Like',fn:()=>{p.liked=!p.liked;save();const h=b.g.lastChild;h.innerHTML=IC.heart(p.liked);h.classList.remove('heartpop');void h.offsetWidth;h.classList.add('heartpop');toast(p.liked?'Added to highlights':'Removed from highlights')}}],.8,true);
 show('view');
 const c=await colorInfo(p.imgs[0],true);V.style.background=c.css;V.style.color=c.lum>.58?'#111':'#fff';retone($('#bar'),c.lum);
}

/* edit: draft is kept in memory, nothing is saved until Done */
function openEdit(id){
 const p=get(id),E=$('#edit'),d={title:p.title,sub:p.sub||'',imgs:[...p.imgs],busy:false};
 E.innerHTML='<div class="stage"><div id="eimgs"></div><button class="glass dk" id="addpic" style="width:100%"></button><input class="field" id="et" maxlength="60" placeholder="Title"><textarea class="field" id="es" maxlength="300" placeholder="Subtitle"></textarea></div>';
 $('#addpic').innerHTML=IC.plus+' Add picture';
 const et=$('#et'),es=$('#es');et.value=d.title;es.value=d.sub;et.oninput=()=>d.title=et.value;es.oninput=()=>d.sub=es.value;
 const render=(from=1e9)=>{
  const box=$('#eimgs');box.innerHTML='';
  d.imgs.forEach((s,i)=>{const w=document.createElement('div');w.className='imgwrap';w.style.backgroundImage=`url(${s})`;if(i<from)w.style.animation='none';
   const btn=document.createElement('button');btn.className='glass lt';btn.textContent='Delete this picture';w.append(btn);box.append(w);
   colorInfo(s).then(c=>{btn.classList.remove('lt','dk');btn.classList.add(toneCls(c.lum))});
   let armed=0;
   btn.onclick=()=>{
    if(d.imgs.length==1){ /* last picture = delete post */
     if(!armed){armed=1;btn.textContent='Tap again to delete post';btn.classList.add('danger');setTimeout(()=>{armed=0;btn.textContent='Delete this picture';btn.classList.remove('danger')},3000);return}
     posts=posts.filter(x=>x.id!==id);save();goLibrary();toast('Post deleted');return}
    w.classList.add('out');setTimeout(()=>{d.imgs.splice(d.imgs.indexOf(s),1);render()},240)}});
  $('#addpic').style.display=d.imgs.length<10?'':'none'};
 render();
 $('#addpic').onclick=()=>pickFiles(fs=>addFiles(d,fs,start=>render(start)));
 setBar({html:IC.x,round:1,label:'Discard changes',fn:()=>openPost(id)},[{html:'Done',fn:()=>{if(!d.title.trim())return toast('A title is required');p.title=d.title.trim();p.sub=d.sub.trim();p.imgs=d.imgs;save();openPost(id)}}],0);
 show('edit');
}

/* compose */
function openCompose(){
 const C=$('#compose'),d={imgs:[],busy:false};
 C.innerHTML='<div class="comp"><h2>New post</h2><div class="thumbs" id="th"></div><div class="counter" id="cnt"></div><input class="inp" id="ct" maxlength="60" placeholder="Title"><textarea class="inp" id="cs" rows="4" maxlength="300" placeholder="Subtitle"></textarea></div>';
 const render=(from=1e9)=>{
  const th=$('#th');th.innerHTML='';
  d.imgs.forEach((s,i)=>{const t=document.createElement('div');t.className='thumb';t.style.backgroundImage=`url(${s})`;if(i<from)t.style.animation='none';
   const x=document.createElement('button');x.className='glass dk';x.innerHTML=IC.x;x.onclick=()=>{t.classList.add('out');setTimeout(()=>{d.imgs.splice(d.imgs.indexOf(s),1);render()},240)};t.append(x);th.append(t)});
  if(d.imgs.length<10){const pk=document.createElement('button');pk.className='pick';pk.innerHTML=IC.plus+'Add';pk.onclick=()=>pickFiles(fs=>addFiles(d,fs,st=>render(st)));th.append(pk)}
  $('#cnt').textContent=d.imgs.length+' / 10 pictures'};
 render();
 let posting=false;
 setBar({html:IC.x,round:1,label:'Cancel',fn:goLibrary},[{html:'Post',fn:()=>{
  if(posting||d.busy)return;const ti=$('#ct').value.trim(),su=$('#cs').value.trim();
  if(!d.imgs.length)return toast('Add at least one picture');if(!ti)return toast('Add a title');if(!su)return toast('Add a subtitle');
  posting=true;posts.push({id:uid(),title:ti,sub:su,imgs:d.imgs,liked:false,ts:Date.now()});save();goLibrary();toast('Posted')}}],isDark()?0:1);
 show('compose');
}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if($('#library').classList.contains('on')||$('#compose').classList.contains('on'))retone($('#bar'),isDark()?0:1)});
openDB().then(load).then(goLibrary);
</script>
</body>
